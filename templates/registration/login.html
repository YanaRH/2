{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<h2>Вход в систему</h2>
<form method="post">
    {% csrf_token %}
    <label>Логин: <input type="text" name="username"></label><br><br>
    <label>Пароль: <input type="password" name="password"></label><br><br>
    <button type="submit">Войти</button>
</form>
{% endblock %}
